name: themis-core

services:
  chain:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && npx hardhat node --hostname 0.0.0.0"
    environment:
      HARDHAT_DISABLE_TELEMETRY_PROMPT: "true"
    ports:
      - "8545:8545"
    volumes:
      - .:/app
      - chain_modules:/app/node_modules

  core:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      RPC_URL: http://chain:8545
    ports:
      - "3000:3000"
    depends_on:
      - chain

volumes:
  chain_modules:
